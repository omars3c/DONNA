[project]
name = "donna"
version = "1.0.0"
description = "D.O.N.N.A. / J.A.R.V.I.S. Tactical AI Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
    "sounddevice",
    "google-genai",
    "google-generativeai",
    "pillow",
    "requests",
    "beautifulsoup4",
    "duckduckgo-search",
    "edge-tts",
    "miniaudio",
    "playwright",
    "pyautogui",
    "pyperclip",
    "pygetwindow",
    "opencv-python",
    "numpy",
    "mss",
    "psutil",
    "send2trash",
    "youtube-transcript-api",
    "python-pptx",
    "fastapi",
    "uvicorn[standard]",
    "cryptography",
    "python-multipart",
    "python-docx",
    "vosk",
    "qrcode[pil]",
    "sentry-sdk",
    "comtypes; sys_platform == 'win32'",
    "pycaw; sys_platform == 'win32'",
    "win10toast; sys_platform == 'win32'",
    "pywinauto; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx",
]

[tool.uv]
managed = true
